#Fangs 'n Claws — Common Configuration
[spawn_toggles]
	#Enable or disable natural spawning for each mob. Can also be controlled per-world via /gamerule.
	#Allow Goblins to spawn naturally (overworld, night only)
	allow_goblin = true
	#Allow Ogres to spawn naturally (overworld)
	allow_ogre = true
	#Allow Cave Ogres to spawn naturally (caves)
	allow_cave_ogre = true
	#Allow Big Golems to spawn naturally (plains)
	allow_golem = true
	#Allow Owlbears to spawn naturally (forest + taiga)
	allow_owlbear = true
	#Allow Shrikes to spawn naturally (snowy forest + snowy taiga)
	allow_shrike = true
	#Allow Silver Skeletons to spawn naturally (overworld)
	allow_silver_skeleton = true
	#Allow Evil Bats to spawn naturally (overworld)
	allow_evil_bat = true
	#Allow Ghosts to spawn naturally (overworld + Soul Sand Valley)
	allow_ghost = true
	#Allow Werewolves to spawn naturally (overworld)
	allow_werewolf = true
	#Allow Dart Goblins to spawn naturally (overworld, night only)
	allow_dart_goblin = true
	#Allow Imps to spawn naturally (nether, any biome)
	allow_imp = true
	#Allow Hell Ogres to spawn naturally (nether)
	allow_hell_ogre = true
	#Allow Scorpions to spawn naturally (overworld)
	allow_scorpion = true
	#Allow Ice Golems to spawn naturally (snowy biomes)
	allow_ice_golem = true
	#Allow Fire Ghosts to spawn naturally (overworld + Crimson Forest + Nether Wastes)
	allow_fire_ghost = true
	#Allow Desert Scorpions to spawn naturally (desert, daytime)
	allow_desert_scorpion = true
	#Allow Frost Scorpions to spawn naturally (snowy biomes)
	allow_frost_scorpion = true
	#Allow Nether Scorpions to spawn naturally (Crimson Forest + Nether Wastes)
	allow_nether_scorpion = true
	#Allow Horse Bats to spawn naturally
	allow_horse_bat = true
	#Allow Nightmare Horses to spawn naturally (Nether)
	allow_nightmare_horse = true
	#Allow Wild Wolves to spawn naturally
	allow_wild_wolf = true
	#Allow Hyenas to spawn naturally (desert, savanna, badlands)
	allow_hyena = true
	#Allow Carnivorous Plants to spawn naturally (jungle)
	allow_carnivorous_plant = true
	#Allow Fire Skulls to spawn naturally (above lava, overworld and nether)
	allow_fire_skull = true
	#Allow Acid Skulls to spawn naturally (swamps)
	allow_acid_skull = true
	#Allow Mimics to replace loot chests in structures (also /gamerule allowSpawnMimic). See mimic_spawn_chance for the rate.
	allow_mimic = true

#Mob behaviour toggles. Each mirrors a /gamerule of the same name — changing either applies.
[behavior]
	#Keep the vanilla Skeleton Horse instead of the mod's tamable version (also /gamerule vanillaSkeletonHorse)
	vanilla_skeleton_horse = false
	#Keep the vanilla Zombie Horse instead of the mod's tamable version (also /gamerule vanillaZombieHorse)
	vanilla_zombie_horse = false
	#Allow Skeleton Horses to spawn naturally at night, whichever version is used (also /gamerule allowNaturalSpawnSkeletonHorse)
	allow_natural_spawn_skeleton_horse = true
	#Allow Zombie Horses to spawn naturally at night, whichever version is used (also /gamerule allowNaturalSpawnZombieHorse)
	allow_natural_spawn_zombie_horse = true
	#Allow Goblins to steal items from players' inventories (also /gamerule allowGoblinStealing)
	allow_goblin_stealing = true
	#When a loot chest is generated in a structure (stronghold, mineshaft, temple, dungeon, ...),
	#it has a 1/x chance of being replaced by a Mimic that steals the chest's loot.
	#Higher value = fewer mimics. 1 = every structure chest is a mimic.
	#Set very high (e.g. 100000) to effectively disable structure mimics.
	# Default: 20
	# Range: 1 ~ 100000
	mimic_spawn_chance = 20

#Cap Fangs 'n Claws mob density per dimension.
#For each: -1 = unlimited, 0 = no F&C spawns, N = density cap (N scaled by loaded chunks / 289, like the vanilla mob cap).
[spawn_limits]
	# Default: 40
	# Range: -1 ~ 100000
	overworld = 40
	# Default: 20
	# Range: -1 ~ 100000
	the_nether = 20
