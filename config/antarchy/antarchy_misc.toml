[elythia]
	#Whether firefly ambient particles appear at night in the Elythia dimension.
	fireflyParticlesEnabled = true
	#Whether Elythia uses its denser atmospheric fog. Client-side visual only.
	fogEnabled = true
	#Whether low ground mist drifts over Elythia meadows in the mornings. Client-side visual only.
	groundMistEnabled = true
	#Whether the low, mid and towering Elythia clouds use soft translucent clouds instead of solid blocky ones. Client-side visual only.
	softCloudsEnabled = true
	#Whether shadows, caves, and nights in Elythia are tinted lavender instead of fading to black. Client-side visual only.
	dreamShadowsEnabled = true
	#Strength of the Elythia lavender shadow tint, from 0.0 to 1.0.
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	dreamShadowsStrength = 1.0
	#Whether beds in Elythia set your spawn and let you lie down at any time, but never skip the night.
	alreadyDreaming = true
	#Whether water in Elythia is clearer and tinted turquoise. Client-side visual only.
	clearWater = true
	#Whether brown ant trips to Elythia play the Descent, sinking into a void and gliding down from the sky, and trips home play the Waking.
	brownAntDescent = true
	#Whether red ant trips to and from Thoraxis play the Flip, where you fall upward as the world rolls over.
	redAntFlip = true
	#Whether termite trips to and from Cavaryn play the Burrow, crumbling through the ground or bursting back out.
	termiteBurrow = true
	#Whether rainbow ant trips to and from Infinity dimensions play the Prism, splitting the world into color.
	rainbowAntPrism = true
	#Whether rain in Elythia is purple and falls slowly. Client-side visual only.
	purpleRain = true
	#Whether a faint echo of yourself sometimes replays where you walked a few minutes earlier. Client-side visual only.
	echoes = true
	#Whether Elythia rolls sky, weather, and creature events such as auroras, meteor showers, lumen rain, towering clouds, and deer migrations.
	events = true
	#Whether rain in Elythia makes exposed crops and saplings grow faster. Lumen rain doubles the effect.
	rainGrowth = true
	#Whether Thoraxis rolls events such as weightlessness, temporal bubbles, upward antiwater rain, the watching eyes, blind skies, and dreamstorms.
	thoraxisEvents = true

	[elythia.throwbackZones]
		#Whether Throwback Zones appear around nostalgic structures and in the wild in Elythia.
		enabled = true
		#How many blocks a Throwback Zone extends beyond a nostalgic structure.
		# Default: 10
		# Range: 1 ~ 128
		structureZoneRadius = 10
		#Chance that each 320x320 block region of Elythia contains a free-standing Throwback Zone.
		# Default: 0.35
		# Range: 0.0 ~ 1.0
		wildZoneChance = 0.35
		#Whether players inside a Throwback Zone have no attack cooldown.
		noAttackCooldown = true
		#Whether players inside a Throwback Zone use the classic hurt sound.
		classicHurtSound = true
		#Whether hunger is hidden and paused inside a Throwback Zone, with food healing hearts directly like pre-Beta 1.8.
		classicFood = true
		#Whether classic music plays inside a Throwback Zone.
		classicMusic = true
		#Whether fog closes in inside a Throwback Zone.
		denseFog = true
		#Whether the dream post effect and Elythia color grade are rendered.
		dreamHaze = true
		#Strength of the dream post effect inside Throwback Zones, from 0.0 to 1.0.
		# Default: 1.0
		# Range: 0.0 ~ 1.0
		dreamStrength = 1.0
		#Whether the very faint afterimage part of the dream effect is rendered.
		afterimages = true

[dreamSand]
	#Multiplier applied to dream sand's falling-block gravity, i.e. how slowly it falls as a block.
	# Default: 0.4
	# Range: 0.0 ~ 16.0
	fallingBlockGravityMultiplier = 0.4

[ichor]
	#If true, players submerged in ichor receive a Wither effect.
	witherEnabled = true

[hushweed]
	#How long (in seconds) a Hushweed spore projectile stays alive before disappearing.
	# Default: 5.0
	# Range: 0.1 ~ 120.0
	sporeLifetimeSeconds = 5.0

[infinityDimensions]
	#If true, book and quills cannot be thrown into nether portals to create random dimensions.
	disableInfinityBookPortalCreation = true
	#Whether rainbow ants open randomly generated Infinity dimensions.
	#Only works if the Infinite Dimensions mod is installed.
	rainbowAntsLeadToInfinityDimensions = true
	#Chance for a rainbow ant Infinity destination roll to select an Infinity easter egg dimension instead of a normal generated one.
	#0.01 = 1%, 0 disables easter egg rolls.
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	rainbowAntInfinityEasterEggChance = 0.01

[permanentPortals]
	#Master toggle for sacrifice-activated permanent portals.
	permanentPortalsEnabled = true
	#Whether flint and steel can ignite permanent portal frames.
	permanentPortalsFlintAndSteelEnabled = false
	#Whether mossy ouranwood wood portals to Elythia can activate and function.
	elythiaPortalEnabled = true
	#Whether Nyxite portals to Thoraxis can activate and function.
	thoraxisPortalEnabled = true
	#Whether Myrmite portals to Cavaryn can activate and function.
	cavarynPortalEnabled = true

[diamondMinecart]
	#Master toggle for the diamond minecart's custom propulsion and rail-laying behavior.
	enabled = true
	#Whether the cart automatically places normal rails from the rider's inventory.
	placesRails = true
	#Minimum maintained speed while ridden without holding W. Set to 0 for manual control.
	# Default: 0.0
	# Range: 0.0 ~ 2.0
	cruiseSpeed = 0.0
	#Maximum speed in blocks/tick when W is held. Vanilla rideable minecarts cap at 0.4.
	# Default: 0.55
	# Range: 0.05 ~ 2.0
	maxSpeed = 0.55
	#Speed gained per tick while accelerating.
	# Default: 0.02
	# Range: 0.001 ~ 0.5
	acceleration = 0.02
	#Speed lost per tick while S is held (active braking).
	# Default: 0.05
	# Range: 0.001 ~ 0.5
	deceleration = 0.05
	#Speed lost per tick when neither W nor S is held.
	# Default: 0.02
	# Range: 0.001 ~ 0.5
	coastDeceleration = 0.02
	#Whether the cart damages mobs it hits while moving.
	mobDamageEnabled = false
	#Maximum collision damage dealt at full speed if mob damage is enabled.
	# Default: 4.0
	# Range: 0.0 ~ 200.0
	maxMobDamage = 4.0

[hoverboard]
	#Maximum hoverboard speed in blocks/tick while moving forward.
	# Default: 6.0
	# Range: 0.05 ~ 12.0
	maxSpeed = 6.0
	#Hoverboard speed gained per tick while moving forward. Lower values take longer to reach top speed.
	# Default: 0.05
	# Range: 0.001 ~ 1.0
	acceleration = 0.05

[world]
	#If false, duplicator trees do not generate and duplicator saplings produce nothing.
	duplicatorTreeEnabled = true
	#Whether glow vines can be placed and survive when attached under leaf blocks.
	glowVinesUnderLeaves = true
	#If true, empty collision plants like grass do not block melee target picking.
	swingThroughGrassEnabled = true
	fabricKeybindingConflictFixEnabled = true
	experimentalSettingsPopupDisabled = true
	#If true, burning entities use soul fire / dream fire overlays where appropriate.
	entitySpecificFireOverlayEnabled = true

[portalGun]
	canFireThroughGlass = false
	canFireThroughLiquid = false
	canPortalsResizeWhenCreated = true
	canPortalProjectilesChunkload = true
	seeThroughPortals = true
	fancyPortals = true
	# Default: 10000
	# Range: > 1
	maxShootDistance = 10000
	#How many portals can show a live see-through view at once. Each one re-renders the world, so higher values cost frame rate. 0 shows only the animated surface.
	# Default: 8
	# Range: 0 ~ 32
	maxLiveViews = 8
	#Minimum speed in blocks/tick when leaving an upward-facing portal, so the traveller clears it. 0 disables.
	# Default: 0.6
	# Range: 0.0 ~ 4.0
	minFloorExitSpeed = 0.6
	#Maximum speed in blocks/tick when leaving a portal. 0 keeps momentum uncapped.
	# Default: 0.0
	# Range: 0.0 ~ 100.0
	maxExitSpeed = 0.0
	#Whether a portal opened by shooting the moon rips blocks loose and pulls them into space.
	moonPullsBlocks = true
	#How long a moon portal stays open, in seconds.
	# Default: 10
	# Range: 1 ~ 120
	moonPortalSeconds = 10
	#Maximum number of blocks a single moon portal can pull in.
	# Default: 500
	# Range: 0 ~ 2000
	moonBlockCap = 500
